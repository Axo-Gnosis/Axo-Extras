[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.89"
repository = "https://git.ryot.foo/toph/Axo-Extras"

[workspace.dependencies]
# The rev of `axo`, `axo-agent` and `axo-ai` must equal the host's axo rev, or Cargo builds
# two copies of each.
axo = { git = "https://git.ryot.foo/toph/axo.git", rev = "65bd2ab415e0ec58aef89795c1f84e756625e45a" }
axo-agent = { git = "https://git.ryot.foo/toph/axo.git", rev = "65bd2ab415e0ec58aef89795c1f84e756625e45a" }
axo-ai = { git = "https://git.ryot.foo/toph/axo.git", rev = "65bd2ab415e0ec58aef89795c1f84e756625e45a" }
# Versions and features match axo's `[workspace.dependencies]`.
async-trait = "0.1.92"
base64 = "0.23.1"
futures = "0.3.34"
jiff = "0.2.38"
rand = "0.10.3"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "stream", "json", "http2", "form"] }
serde = { version = "1.0.229", features = ["derive", "rc"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
serde_norway = "0.9.42"
sha2 = "0.11.1"
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "net", "io-util", "io-std", "process"] }
tokio-util = "0.7.20"
tracing = "0.1.44"
unicode-normalization = "0.1.26"
url = "2.5.8"
# Not in axo.
anyhow = "1.0"
# candle and tokenizers match the host's, or the host builds two of each.
candle-core = "0.11"
candle-nn = "0.11"
candle-transformers = "0.11"
# The ported library's date handling.
chrono = "0.4"
# Must equal the host's version: two bundled SQLite copies do not link.
rusqlite = { version = "0.33", features = ["bundled"] }
tokenizers = { version = "0.23", default-features = false, features = ["fancy-regex"] }
walkdir = "2"
zstd = "0.13"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# candle-core 0.11.1 re-reads /proc/cpuinfo on every CPU matmul unless
# RAYON_NUM_THREADS is set (~55 ms instead of ~15 ms per forward). This fork is
# 0.11.1 plus the fix from https://github.com/huggingface/candle/pull/4067.
# Patches do not reach dependents: hosts must carry the same line.
# ponytail: drop this once a candle release includes the fix.
[patch.crates-io]
candle-core = { git = "https://git.ryot.foo/toph/candle.git", rev = "e2af193fe630f2d86c39fd6f5c9f993d0aa60cdf" }

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 1
debug = 0

[profile.dev.package.candle-core]
opt-level = 2

[profile.dev.package.candle-nn]
opt-level = 2

[profile.dev.package.candle-transformers]
opt-level = 2

[profile.dev.package.gemm]
opt-level = 2

[profile.dev.package.tokenizers]
opt-level = 2

[profile.dev.package.ring]
opt-level = 2
