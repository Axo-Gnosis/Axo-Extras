[package]
name = "axo-memory"
version = "0.0.0"
description = "Long-term memory for axo hosts: linked Markdown notes, hybrid search, a memory:// scheme, and capture of durable facts from sessions"
edition.workspace = true
license = "AGPL-3.0-or-later"
rust-version.workspace = true
repository.workspace = true

[features]
default = ["bge"]
# The bundled BAAI/bge-small-en-v1.5 embedder (candle, CPU).
bge = ["dep:axo-models", "dep:candle-core", "dep:candle-nn", "dep:candle-transformers", "dep:tokenizers"]

[dependencies]
async-trait.workspace = true
axo.workspace = true
axo-agent.workspace = true
axo-ai.workspace = true
axo-models = { path = "../axo-models", optional = true }
candle-core = { workspace = true, optional = true }
candle-nn = { workspace = true, optional = true }
candle-transformers = { workspace = true, optional = true }
chrono.workspace = true
regex.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_norway.workspace = true
sha2.workspace = true
tempfile.workspace = true
thiserror.workspace = true
tokenizers = { workspace = true, optional = true }
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
unicode-normalization.workspace = true
walkdir.workspace = true

[lints]
workspace = true
